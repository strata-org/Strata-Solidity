name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

# Run only one CI per ref; cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest

    steps:
      # Strata is vendored as a git submodule at ./Strata (REQ-STRATA-001).
      # `submodules: recursive` ensures the submodule (and any of its own
      # nested submodules, should they appear later) is initialized at the
      # SHA recorded in this repo's tree.
      - name: Checkout StrataSolidity (with Strata submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Verify the submodule layout the build expects (REQ-STRATA-001,
      # REQ-STRATA-005). This script is the same one strata-verify.sh,
      # bench/bench.sh, and test/run_tests.sh invoke at startup; running
      # it here surfaces a missing/uninitialized submodule before the
      # heavy toolchain steps.
      - name: Verify Strata submodule precondition
        run: bash scripts/check-strata.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Match the documented minimum (README.md, docs/guide/src/installation.md
          # both list Python 3.12+ as a prerequisite). Ubuntu runners ship 3.12
          # by default; pinning here keeps CI in lockstep with the published
          # install instructions.
          python-version: '3.12'

      - name: Install solc
        run: |
          # solc is a runtime prerequisite for solast.py (Tools/Solidity/src/solast.py
          # invokes `solc --standard-json`). The Ubuntu PPA package is fine for
          # the AST-extraction-only path that StrataSolidity uses.
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update -y
          sudo apt-get install -y solc
          solc --version

      - name: Install z3
        run: |
          # The Strata Core verifier shells out to a `z3` binary on PATH
          # (StrataSolidityMain.lean wires `solver := "z3"` into VerifyOptions,
          # see design.md §6.5 / GAP-012). Without it, every obligation fails
          # with `SMT Solver Invocation Error: could not execute external
          # process 'z3'`. Listed as a prerequisite in README.md and
          # docs/guide/src/installation.md; the CI install step had been
          # missing.
          sudo apt-get install -y z3
          z3 --version

      - name: Install Python dev dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Tools/Solidity/requirements-dev.txt
          python3 -m pip install pytest

      # ---- Stages 2 + 3: lake build + lake test ----
      # leanprover/lean-action handles elan install, .lake caching
      # (keyed on lean-toolchain + lake-manifest.json), `lake build`,
      # and `lake test` in one step.
      #
      # Cache + stale-dialect handling
      # ------------------------------------------------------------------
      # `#load_dialect "../Tools/Solidity/dialects/Solidity.dialect.st.ion"`
      # in StrataSolidity/SolidityDialect.lean reads the Ion file at
      # elaboration time, but Lake does NOT track the .ion as a build input.
      # The .lake cache key (toolchain + manifest, falling back across
      # commits) therefore restores a SolidityDialect.olean built against a
      # DIFFERENT Ion — e.g. a `feat/upstream-port` build with an older
      # dialect schema. A PR that regenerates the Ion (any dialect change)
      # then compiles its translator against the stale generated AST and
      # fails with errors like "Function expected at node.Literal …" or
      # "Unknown constant Strata.Solidity.node.EmitStatement".
      #
      # The previous workaround busted the olean in a step BEFORE
      # lean-action — but lean-action runs `actions/cache/restore` INSIDE
      # itself (see leanprover/lean-action action.yml), so the restore
      # re-added the stale olean seconds after the bust deleted it,
      # defeating the workaround entirely.
      #
      # Fix: drive caching ourselves so the bust runs strictly AFTER the
      # restore and is not undone. We restore the .lake cache, delete the
      # dialect-derived oleans (forcing a fresh elaboration from the
      # committed Ion + a rebuild of everything that pattern-matches the
      # generated AST), then run lean-action with use-github-cache:false,
      # and finally save the cache.
      #
      # Long-term fix: upstream `#load_dialect` should register the Ion as a
      # build input so Lake invalidates dependent oleans automatically; then
      # this whole dance collapses back to a plain lean-action call.
      - name: restore .lake cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: bust stale dialect-derived oleans (AFTER restore)
        run: |
          # Remove the Ion-loaded canonical dialect olean and every olean that
          # transitively pattern-matches the #strata_gen-generated AST types.
          # This forces a fresh elaboration from the committed Ion and a
          # rebuild of the translator against the correct constructor layout,
          # while leaving the (expensive) Strata submodule oleans cached.
          #
          # Match SolidityDialect.* but NOT SolidityDialectLean* /
          # SolidityDialectParity* (those are independent modules).
          shopt -s nullglob
          for base in lib/lean ir; do
            d=".lake/build/${base}/StrataSolidity"
            # canonical dialect (Ion-loaded), excluding *Lean* / *Parity*
            for f in "$d"/SolidityDialect.*; do rm -f "$f"; done
            # downstream consumers of the generated AST
            rm -f "$d"/Solidity.* "$d"/ReadSolidity.* 2>/dev/null || true
            rm -rf "$d"/SolTranslator 2>/dev/null || true
          done

      - name: lake build + lake test
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: false
          use-github-cache: false

      - name: save .lake cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}

      # ---- Stage 5: golden + REQ-PBT-007 exit-code sub-stage ----
      # test/run_tests.sh runs strata-verify.sh against test/examples/*.sol
      # and diffs against test/expected/*.expected. After the per-fixture
      # loop it invokes test/run_exit_code_tests.sh which pins the
      # REQ-PBT-007 exit-code contract (REQ-CLI-050..REQ-CLI-052).
      - name: test/run_tests.sh (golden + REQ-PBT-007)
        run: bash test/run_tests.sh

      # ---- Stage 6 (schema-only): REQ-PBT-008 against committed CSV ----
      # bench/bench.sh itself is intentionally NOT run in CI: b6_erc20
      # routinely takes 10+ minutes locally, which is too slow for the
      # hot path. The schema enforcer is run against the committed
      # bench/results.csv so any drift in the CSV header or row shape
      # (REQ-TEST-032..REQ-TEST-034) blocks the merge.
      - name: bench/check_csv_schema.py (REQ-PBT-008, committed CSV)
        run: python3 bench/check_csv_schema.py bench/results.csv

      # ---- Stage 7: SARIF 2.1.0 schema compliance (REQ-PBT-004) ----
      # The pytest fixture spawns strata-verify.sh --sarif against curated
      # fixtures and validates the stdout against the vendored OASIS schema.
      # Skipped automatically if the binary, dialect, or solc are missing
      # (the test prints a Skip with a reason); this stage will fail only
      # on a real schema violation.
      - name: pytest Tools/Solidity/test (REQ-PBT-004 SARIF schema)
        run: python3 -m pytest Tools/Solidity/test -v
