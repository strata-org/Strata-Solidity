name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

# Run only one CI per ref; cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest

    steps:
      # Strata is vendored as a git submodule at ./Strata (REQ-STRATA-001).
      # `submodules: recursive` ensures the submodule (and any of its own
      # nested submodules, should they appear later) is initialized at the
      # SHA recorded in this repo's tree.
      - name: Checkout StrataSolidity (with Strata submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Verify the submodule layout the build expects (REQ-STRATA-001,
      # REQ-STRATA-005). This script is the same one strata-verify.sh,
      # bench/bench.sh, and test/run_tests.sh invoke at startup; running
      # it here surfaces a missing/uninitialized submodule before the
      # heavy toolchain steps.
      - name: Verify Strata submodule precondition
        run: bash scripts/check-strata.sh

      # Strata is a path dependency, so Lake builds it into Strata/.lake,
      # outside the root .lake that lean-action caches. That build is
      # restored here and saved after `lake build` + `lake test`. The key is
      # what it depends on: the toolchain, the manifest (Strata's own
      # dependencies) and the submodule commit. Without an exact match, the
      # newest cache with the same toolchain and manifest is restored and
      # Lake rebuilds what changed; it checks every restored module against
      # its sources either way.
      - name: Strata submodule commit
        id: strata
        run: |
          commit=$(git rev-parse HEAD:Strata)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore the Strata build
        id: strata-cache
        uses: actions/cache/restore@v6
        with:
          path: Strata/.lake
          key: strata-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ steps.strata.outputs.commit }}
          restore-keys: |
            strata-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # Match the documented minimum (README.md, docs/guide/src/installation.md
          # both list Python 3.12+ as a prerequisite). Ubuntu runners ship 3.12
          # by default; pinning here keeps CI in lockstep with the published
          # install instructions.
          python-version: '3.12'

      - name: Install solc
        run: |
          # solc is a runtime prerequisite: the strataSolidity binary invokes
          # `solc --standard-json` (StrataSolidity/SolcRunner.lean). The Ubuntu
          # PPA package is fine for the AST-extraction-only path used here.
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update -y
          sudo apt-get install -y solc
          solc --version

      - name: Install z3
        run: |
          # The Strata Core verifier shells out to a `z3` binary on PATH
          # (StrataSolidityMain.lean wires `solver := "z3"` into VerifyOptions,
          # see design.md §6.5 / GAP-012). Without it, every obligation fails
          # with `SMT Solver Invocation Error: could not execute external
          # process 'z3'`. Listed as a prerequisite in README.md and
          # docs/guide/src/installation.md; the CI install step had been
          # missing.
          sudo apt-get install -y z3
          z3 --version

      - name: Install Python dev dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Tools/Solidity/requirements-dev.txt
          python3 -m pip install pytest

      # ---- Stages 2 + 3: lake build + lake test ----
      # leanprover/lean-action handles elan install, .lake caching
      # (keyed on lean-toolchain + lake-manifest.json), `lake build`,
      # and `lake test` in one step.
      #
      # The dialect is now declared directly in Lean
      # (StrataSolidity/SolidityDialect.lean, `#dialect … #end` +
      # `#strata_gen`), so there is no Ion artifact that Lake fails to
      # track and no stale-olean hazard: any dialect edit is an ordinary
      # .lean change that Lake invalidates like any other. The former
      # restore→bust→build→save cache dance is gone.
      - name: lake build + lake test
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          lint: false

      # Saved before the remaining test steps, so a failure in one of them
      # does not throw the build away. Skipped when the exact key was
      # restored.
      - name: Save the Strata build
        if: steps.strata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Strata/.lake
          key: ${{ steps.strata-cache.outputs.cache-primary-key }}

      # ---- Stage 5: golden + REQ-PBT-007 exit-code sub-stage ----
      # test/run_tests.sh runs strata-verify.sh against test/examples/*.sol
      # and diffs against test/expected/*.expected. After the per-fixture
      # loop it invokes test/run_exit_code_tests.sh which pins the
      # REQ-PBT-007 exit-code contract (REQ-CLI-050..REQ-CLI-052).
      - name: test/run_tests.sh (golden + REQ-PBT-007)
        run: bash test/run_tests.sh

      # ---- Stage 6 (schema-only): REQ-PBT-008 against committed CSV ----
      # bench/bench.sh itself is intentionally NOT run in CI: b6_erc20
      # routinely takes 10+ minutes locally, which is too slow for the
      # hot path. The schema enforcer is run against the committed
      # bench/results.csv so any drift in the CSV header or row shape
      # (REQ-TEST-032..REQ-TEST-034) blocks the merge.
      - name: bench/check_csv_schema.py (REQ-PBT-008, committed CSV)
        run: python3 bench/check_csv_schema.py bench/results.csv

      # ---- Stage 7: SARIF 2.1.0 schema compliance (REQ-PBT-004) ----
      # The pytest fixture spawns strata-verify.sh --sarif against curated
      # fixtures and validates the stdout against the vendored OASIS schema.
      # Skipped automatically if the binary or solc are missing (the test
      # prints a Skip with a reason); this stage fails only on a real
      # schema violation.
      - name: pytest Tools/Solidity/test (REQ-PBT-004 SARIF schema)
        run: python3 -m pytest Tools/Solidity/test -v
