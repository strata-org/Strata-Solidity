assigns; every memory variable if it writes memory; all contract state (of its
type) if it may write storage (`sstore`, calls). A block that may `return` or
`stop` ends the transaction on some paths. Rejected: assigning a storage
reference, writing memory with a memory struct in scope, and ending a
constructor.'''
