# The capability ledger: what StrataSolidity verifies, partly verifies,
# skips or rejects, one entry per feature, each backed by the tests that
# show it. The feature tables in LIMITATIONS.md, README.md, FAQ.md, the
# guide (supported_features.md, limitations.md, first_verification.md),
# the next-spec's gap table and the landing page are generated from this
# file: edit it, then run `python3 scripts/capabilities.py`. CI runs
# `python3 scripts/capabilities.py --check`, which fails when a witness no
# longer holds or a generated table is out of date. See the script's
# docstring for the checks, and CONTRIBUTING.md ("The capability ledger").
#
# A capability:
#   id        stable name; fixtures for a gap cite it (gap_<…>.sol)
#   area      one of the [[area]] ids below
#   feature   what a user writes, in Markdown (no `|`)
#   status    verified | partial | unknown | skipped | rejected | fails
#             (meanings: STATUSES in scripts/capabilities.py)
#   notes     what holds, in Markdown (no `|`); `](guide:page.md#anchor)`
#             links to a guide page
#   gap       the baseline GAP it concerns, if any (see [[gap]])
#   works / not_yet   the text of the entry in the short lists of the
#             README, the FAQ and the landing page, if it has one there
#   witness   evidence, each one of:
#     { fixture = "<name>", proven | refuted | unknown | not_proven = "<obligation>", line = N }
#         an obligation of test/examples/<name>.sol, as its golden file
#         test/expected/<name>.expected reports it (`line` optional)
#     { fixture = "<name>", error = "<text>" }     a translation error containing <text>
#     { fixture = "<name>", warning = "<text>" }   a warning (<name>.warnings) containing <text>
#     { test = "<path>", contains = "<text>" }     a test that CI runs
#     { source = "<path>", contains = "<text>" }   a fact of the code

# The short lists of the README, the FAQ and the landing page, in order: the
# ids of the entries whose `works` or `not_yet` text they show.
[highlights]
works = ["mappings", "invariant", "modifies", "forall", "loop-invariant-old",
         "inheritance", "unchecked", "counterexamples"]
not_yet = ["struct-mapping", "libraries", "revert-call", "string-bytes",
           "array-pop", "constructor-internal-call", "inheritance-imported",
           "unknown-results"]

[[area]]
id = "spec"
title = "Specifications"

[[area]]
id = "contracts"
title = "Contracts and functions"

[[area]]
id = "inheritance"
title = "Inheritance"

[[area]]
id = "types"
title = "Types and arithmetic"

[[area]]
id = "data"
title = "Mappings, arrays and structs"

[[area]]
id = "statements"
title = "Statements and expressions"

[[area]]
id = "environment"
title = "Transaction values"

[[area]]
id = "calls"
title = "External calls and assembly"

[[area]]
id = "results"
title = "Results and output"

# ------------------------------------------------------------ specifications

[[capability]]
id = "requires-ensures"
area = "spec"
feature = "`requires`, `ensures`"
status = "verified"
notes = '''A precondition is assumed on entry and checked at each internal call; a
postcondition is checked on every path that returns.'''
witness = [
  { fixture = "spec_division", proven = "ensures r == a / 2" },
  { fixture = "spec_division", refuted = "ensures a % 2 == 0 || a % 2 == 1" },
]

[[capability]]
id = "old"
area = "spec"
feature = "`old(e)`"
status = "verified"
notes = '''The value of `e` when the function was entered: of a scalar, a mapping, a
mapping entry or an array length.'''
witness = [
  { fixture = "sum_token", proven = "ensures balances[to] == old(balances[to]) + amount" },
  { fixture = "dynamic_arrays", refuted = "ensures items.length == old(items.length) + 2" },
]

[[capability]]
id = "invariant"
area = "spec"
feature = "Contract invariants (`invariant`)"
status = "verified"
notes = '''Written above the contract or on a state variable. Checked after the
constructor (explicit or implicit) and at the exit of every public or
external function that may change state, and assumed at their entry; assumed
by `view` functions; not assumed by internal functions. `old()` is rejected
in an invariant.'''
works = "Contract invariants, including `sum(mapping)`, checked across external calls that may re-enter the contract"
witness = [
  { fixture = "invariant_entry_points", proven = "invariant a == b" },
  { fixture = "invariant_initializers", refuted = "invariant items.length == 0" },
]

[[capability]]
id = "invariant-transaction-values"
area = "spec"
feature = "`msg.sender`, `msg.value`, `block.*` or `tx.*` in an invariant"
status = "rejected"
notes = '''They change between transactions, so an invariant over them would be
established with one transaction's values and assumed with another's.'''
witness = [
  { fixture = "invariant_msg_sender", error = "`msg.sender` is not allowed in an invariant" },
  { fixture = "invariant_msg_value", error = "`msg.value` is not allowed in an invariant" },
  { fixture = "invariant_block_value", error = "`block.timestamp` is not allowed in an invariant" },
]

[[capability]]
id = "sum"
area = "spec"
feature = "`sum(m)` of a mapping"
status = "verified"
notes = '''The sum of all values of `m`, updated at every write. Its update axiom is
quantified, so an obligation that involves it may be unknown (❓) instead of
refuted.'''
witness = [
  { fixture = "sum_token", proven = "invariant totalSupply == sum(balances)" },
  { fixture = "invariant_entry_points", proven = "ensures r == sum(balances)" },
  { fixture = "sum_token", not_proven = "invariant totalSupply == sum(balances)" },
]

[[capability]]
id = "modifies"
area = "spec"
feature = "`modifies` frames: variables and mapping keys"
status = "verified"
notes = '''`modifies x, m[k]`: every other state variable, and every other key of
`m`, is unchanged. A key may use parameters, constants and hashes
(`roles[DEFAULT_ADMIN_ROLE]`). A function without `modifies` may change any
state. Frames are not checked for constructors (a warning says so).'''
works = "Key-scoped `modifies` frame conditions"
witness = [
  { fixture = "sum_token", proven = "modifies frame (balances)" },
  { fixture = "spec_comments", refuted = "modifies frame (balances)" },
]

[[capability]]
id = "modifies-nested-key"
area = "spec"
feature = "`modifies m[a][b]` (a key with two indexes)"
status = "skipped"
notes = '''The key cannot be read, so the frame of `m` is not checked (a warning says
so). With one index, `modifies m[a]` allows every `m[a][…]` to change.'''
witness = [
  { fixture = "modifies_nested_key", warning = "the key cannot be read, so the frame of `allowance` is not checked" },
]

[[capability]]
id = "loop-invariant"
area = "spec"
feature = "Loop invariants (`loop-invariant`)"
status = "verified"
notes = '''Checked on entry to the loop and preserved by its body, for `for`, `while`
and `do`-`while` loops, with `break` and `continue`.'''
witness = [
  { fixture = "control_flow", proven = "loop invariant #1 of loop 1 is preserved by the loop body" },
  { fixture = "loop_invariant_old", refuted = "loop invariant #1 of loop 1 holds on entry" },
]

[[capability]]
id = "loop-invariant-old"
area = "spec"
feature = "`old(e)` in a loop invariant"
status = "verified"
gap = "GAP-003"
notes = '''The value of `e` at the function's entry, as in `ensures`, not at the
loop's entry.'''
works = "Loop invariants, with `old()`"
witness = [
  { fixture = "loop_invariant_old", proven = "ensures x == old(x) + 5 + n" },
  { fixture = "loop_invariant_old", refuted = "loop invariant #1 of loop 1 holds on entry", line = 30 },
]

[[capability]]
id = "loop-heap-frame"
area = "spec"
feature = "A loop that writes contract state"
status = "partial"
notes = '''The function's `heap frame (only this contract is modified)` obligation is
unknown (❓): the loop does not keep the fact that only this contract's state
changes. Its invariants and postconditions are checked as usual. Writing a
local in the loop, and the state after it, avoids this.'''
witness = [
  { fixture = "loop_invariant_old", proven = "heap frame (only this contract is modified)", line = 17 },
  { fixture = "loop_invariant_old", unknown = "heap frame (only this contract is modified)", line = 50 },
]

[[capability]]
id = "forall"
area = "spec"
feature = "`forall v : T :: P`"
status = "verified"
notes = '''`v` ranges over the values of `T`. An obligation with a `forall` among its
assumptions may be unknown (❓): z3 does not instantiate quantifiers by model
search.'''
works = "`forall` quantifiers, with `==>`"
witness = [
  { fixture = "quantifier_types", proven = "ensures forall v : uint8 :: v <= 255" },
  { fixture = "quantifier_types", refuted = "ensures forall v : uint8 :: v < 255" },
  { fixture = "forall_frame", proven = "ensures forall addr : address :: addr != msg.sender ==> balances[addr] == old(balances[addr])" },
]

[[capability]]
id = "exists"
area = "spec"
feature = "`exists v : T :: P`"
status = "partial"
notes = '''`v` ranges over the values of `T`. z3 does not search for witnesses, so a
true `exists` is often unknown (❓); it is proven when the witness is at hand
(a value the function wrote).'''
witness = [
  { fixture = "quantifier_types", proven = "ensures exists a : address :: balances[a] == v" },
  { fixture = "quantifier_types", refuted = "ensures exists i : uint8 :: i > 255" },
]

[[capability]]
id = "spec-operators"
area = "spec"
feature = "Operators in specifications"
status = "verified"
notes = '''`==`, `!=`, `<`, `<=`, `>`, `>=`, `+`, `-`, `*`, `/`, `%`, `&&`, &#124;&#124;,
`!`, `==>`, unary `-`, `m[k]`, `s.f`, `a.length`, `type(T).min` and
`type(T).max`, named constants. Arithmetic is on unbounded integers (no
wrapping); `/` and `%` round toward zero, as in Solidity.'''
witness = [
  { fixture = "spec_division", proven = "ensures r == a % 2" },
  { fixture = "spec_division", refuted = "ensures r == a / 2" },
  { fixture = "unary_ops", proven = "ensures tick == t" },
  { fixture = "spec_constants", proven = "ensures status == ENTERED" },
]

[[capability]]
id = "spec-operators-missing"
area = "spec"
feature = "`**`, bitwise and shift operators in specifications"
status = "rejected"
notes = '''Not part of the specification language: the translation stops with
"Unexpected tokens after spec expression".'''
witness = [
  { fixture = "gap_spec_operators", error = "Unexpected tokens after spec expression" },
]

[[capability]]
id = "spec-conversion"
area = "spec"
feature = "Type conversions in specifications (`uint8(x)`)"
status = "fails"
notes = '''`address(x)` is accepted (it is the identity); other conversions stop the
translation. In code, conversions work.'''
witness = [
  { fixture = "gap_spec_conversion", error = "'uint8' is not defined" },
]

[[capability]]
id = "spec-environment"
area = "spec"
feature = "`msg.sender`, `msg.value`, `block.*`, `tx.*` and `this` in specifications"
status = "verified"
notes = '''The values of the transaction the function runs in (see Transaction values).'''
witness = [
  { fixture = "environment", proven = "ensures address(this) != address(0)" },
  { fixture = "inheritance", refuted = "ensures msg.sender != owner" },
]

[[capability]]
id = "spec-comments"
area = "spec"
feature = "A `//` comment after an annotation"
status = "verified"
notes = '''`ensures x == 1  // the new value`: the text from `//` on is not read.'''
witness = [
  { fixture = "spec_comments", proven = "ensures x == v" },
  { fixture = "spec_comments", refuted = "ensures x == v + 1" },
]

[[capability]]
id = "annotation-misuse"
area = "spec"
feature = "Misspelled, misplaced or multi-line annotations"
status = "skipped"
notes = '''Reported and ignored, never dropped silently: an unknown keyword, an
annotation where it has no effect, in a plain `//` comment, inside a function
body, in the middle of a comment line, or continued on the next line.'''
witness = [
  { fixture = "ignored_annotations", warning = "unrecognized annotation `@custom:strata ensure count == old(count) + 1`" },
  { fixture = "ignored_annotations", warning = "inside a function or modifier body is ignored" },
  { fixture = "ignored_annotations", warning = "each annotation must fit on one line" },
]

[[capability]]
id = "lemma"
area = "spec"
feature = "`@custom:strata lemma`"
status = "skipped"
gap = "GAP-004"
notes = '''Not an annotation StrataSolidity reads: reported as unrecognized, and
ignored.'''
witness = [
  { fixture = "ignored_annotations", warning = "unrecognized annotation `@custom:strata lemma x == x`" },
]

# ------------------------------------------------------ contracts, functions

[[capability]]
id = "functions"
area = "contracts"
feature = "Contracts, state variables, functions of any visibility, constructors, `receive`, `fallback`"
status = "verified"
notes = '''Every function of every contract in the file is verified against its own
specification; `view` and `pure` functions too.'''
witness = [
  { fixture = "invariant_contract_level", proven = "ensures r == a" },
  { fixture = "invariant_contract_level", refuted = "ensures r == 12345" },
]

[[capability]]
id = "internal-calls"
area = "contracts"
feature = "Internal calls"
status = "verified"
notes = '''Modular: the callee's `requires` is checked at the call, and after it the
caller knows what the callee's `ensures` and `modifies` say. After a call of a
function without a specification, its results and the state are unknown, so
give helpers a specification. Named arguments are bound by name.'''
witness = [
  { fixture = "internal_calls", proven = "ensures balances[to] == old(balances[to]) + amount" },
  { fixture = "internal_calls", not_proven = "ensures balances[to] == old(balances[to])" },
  { fixture = "internal_calls", refuted = "ensures r == 4" },
]

[[capability]]
id = "modifiers"
area = "contracts"
feature = "Modifiers"
status = "verified"
notes = '''Inlined into each function that uses them, the first one outermost, with
their arguments: `_` stands for the rest of the function, and a `return` in
the function still runs the code after `_`.'''
witness = [
  { fixture = "modifiers", proven = "ensures count == old(count) + 1" },
  { fixture = "modifiers", refuted = "ensures count <= 100" },
]

[[capability]]
id = "interfaces"
area = "contracts"
feature = "Interfaces, abstract contracts, functions without a body"
status = "verified"
notes = '''A function without a body may do anything a function of its kind may: a
mutating one may change any state. An interface or library contributes no
invariants.'''
witness = [
  { fixture = "virtual_functions", proven = "ensures x == 5" },
  { fixture = "virtual_functions", unknown = "ensures x == 5" },
]

[[capability]]
id = "overloads"
area = "contracts"
feature = "Overloaded functions"
status = "verified"
notes = '''Each overload is verified, and a call goes to the one solc selects. Overloads
that differ only between integer and address parameters fail to translate.'''
witness = [
  { fixture = "inheritance_overloads", proven = "ensures r == a + b" },
  { fixture = "inheritance_overloads", refuted = "ensures r == a + 1" },
]

[[capability]]
id = "overload-types"
area = "contracts"
feature = "Overloads that differ only between integer and address parameters (`f(uint256)`, `f(address)`)"
status = "fails"
notes = '''Both kinds are integers in the translation, so the two functions get the
same signature ("Duplicate definition").'''
witness = [
  { fixture = "gap_overload_types", error = "Duplicate definition 'GapOverloadTypes_set'" },
]

[[capability]]
id = "events-errors"
area = "contracts"
feature = "Events, custom errors, `revert CustomError(…)`"
status = "verified"
notes = '''`emit` changes nothing (its arguments are still evaluated); `revert` ends
the path.'''
witness = [
  { fixture = "events_errors", proven = "ensures balances[to] == old(balances[to]) + amount" },
  { fixture = "argument_effects", refuted = "ensures counts[0] == old(counts[0])" },
]

[[capability]]
id = "revert-call"
area = "contracts"
feature = '`revert("reason")`, `revert()`'
status = "fails"
notes = '''Use `require(condition, "reason")` or a custom error.'''
not_yet = '`revert("reason")` (`require` and custom errors work)'
witness = [
  { fixture = "gap_revert_call", error = "'GapRevertCall_revert' is not defined" },
]

[[capability]]
id = "constructor-internal-call"
area = "contracts"
feature = "A constructor that calls an internal function using state (`_mint` in a constructor)"
status = "rejected"
notes = '''The constructor has no state to pass to the callee yet.'''
not_yet = "Constructors that call internal functions using state (the `_mint` pattern)"
witness = [
  { fixture = "gap_constructor_call", error = "from a function without contract state access" },
]

[[capability]]
id = "halting-calls"
area = "contracts"
feature = "Calling a function that may end the transaction (`selfdestruct`, assembly `return` or `stop`)"
status = "rejected"
notes = '''The code after such a call would be verified as if it always ran. In the
function itself, a halt ends its path.'''
witness = [
  { fixture = "halt_in_helper", error = "may end the transaction" },
  { fixture = "selfdestruct_in_helper", error = "may end the transaction" },
]

[[capability]]
id = "libraries"
area = "contracts"
feature = "Library calls (`L.f(x)`, `using L for T`)"
status = "fails"
notes = '''A library function called from a contract is not found.'''
not_yet = "Library calls and `using … for`"
witness = [
  { fixture = "gap_library_call", error = "'max' is not defined" },
]

[[capability]]
id = "file-level-functions"
area = "contracts"
feature = "Functions declared outside a contract"
status = "fails"
notes = '''Not verified (a warning says so), and a call of one stops the translation.'''
witness = [
  { fixture = "gap_file_level_function", warning = "file-level function `twice` is not verified" },
  { fixture = "gap_file_level_function", error = "'GapFileLevelFunction_twice' is not defined" },
]

# ---------------------------------------------------------------- inheritance

[[capability]]
id = "inheritance"
area = "inheritance"
feature = "Inheritance: single, multiple, diamond"
status = "verified"
gap = "GAP-009"
notes = '''A contract is verified as the flattening of its bases and itself, ordered
by solc's C3 linearization: inherited state, functions, modifiers and
invariants are checked in its context (an obligation of an inherited function
says so: `(in D)`), and a call of a virtual function calls the most derived
override. A public state variable that overrides a function replaces it.'''
works = "Inheritance: inherited state, functions, modifiers, invariants and constructors, and `super`"
witness = [
  { fixture = "inheritance", proven = "ensures r == a + 1 (in Fast)" },
  { fixture = "inheritance", refuted = "ensures count == old(count) + 1 (in Fast)" },
]

[[capability]]
id = "base-constructors"
area = "inheritance"
feature = "Base constructors"
status = "verified"
gap = "GAP-009"
notes = '''Run after the state-variable initializers and before the derived
constructor, most base first, each with its own modifiers and the arguments a
derived constructor gives it (`constructor() Base(7)`).'''
witness = [
  { fixture = "inheritance_constructors", proven = "ensures price == 5" },
  { fixture = "inheritance_constructors", refuted = "ensures price == 4" },
]

[[capability]]
id = "inheritance-specifier-args"
area = "inheritance"
feature = "Base constructor arguments in an inheritance specifier (`is Base(7)`)"
status = "unknown"
gap = "GAP-009"
notes = '''Not read (the AST the translator receives does not keep them): the base
constructor runs with unknown values of its parameter types.'''
witness = [
  { fixture = "inheritance_constructors", proven = "ensures price <= type(uint256).max" },
  { fixture = "inheritance_constructors", refuted = "ensures price == 7" },
]

[[capability]]
id = "super"
area = "inheritance"
feature = "`super.f(…)`, `Base.f(…)`"
status = "verified"
gap = "GAP-009"
notes = '''`super` follows the linearization of the contract being verified, from the
contract the call is written in (also in a modifier or a base constructor);
`Base.f()` calls the first implementation of `f` in `Base`'s linearization.
Named arguments are bound by name.'''
witness = [
  { fixture = "inheritance_super", proven = "ensures x == val + 1 (in Mid)" },
  { fixture = "inheritance_super", refuted = "ensures x == 2" },
  { fixture = "inheritance_diamond", proven = "ensures x == val + 3 (in D)" },
]

[[capability]]
id = "super-overloaded"
area = "inheritance"
feature = "`super.f(…)` or `Base.f(…)` of an overloaded function"
status = "rejected"
gap = "GAP-009"
notes = '''The call is not resolved to one of the overloads.'''
witness = [
  { fixture = "gap_super_overloaded", error = "of an overloaded function" },
]

[[capability]]
id = "inheritance-imported"
area = "inheritance"
feature = "A base contract from another file"
status = "skipped"
gap = "GAP-009"
notes = '''Its state, functions and invariants are not part of what is verified, for
each contract that inherits it, directly or through another base (a warning
says so).'''
not_yet = "A base contract imported from another file"
witness = [
  { fixture = "inheritance_imported", warning = "is not defined in this file: its state, functions and invariants are not part of what is verified here" },
]

[[capability]]
id = "inheritance-shadowed-state"
area = "inheritance"
feature = "A base's private state variable declared again in a derived contract"
status = "rejected"
gap = "GAP-009"
notes = '''They are different variables, which the translation would merge.'''
witness = [
  { fixture = "inheritance_shadowed_state", error = "declared again" },
]

# ------------------------------------------------------- types and arithmetic

[[capability]]
id = "integers"
area = "types"
feature = "`uint8` … `uint256`, `int8` … `int256`"
status = "verified"
notes = '''A value is in its type's range: parameters, state variables, results of
calls and hashes. Signed state is not assumed to be non-negative.'''
witness = [
  { fixture = "type_ranges", proven = "ensures small <= 255" },
  { fixture = "type_ranges", refuted = "ensures tick >= 0" },
]

[[capability]]
id = "checked-overflow"
area = "types"
feature = "Checked arithmetic (outside `unchecked`)"
status = "partial"
notes = '''Computed on unbounded integers: an overflow is not modelled as a revert, so
the verifier also considers the execution continuing with the out-of-range
value. That only adds behaviors: a property that relies on the revert may not
be proven (see [Integers](guide:integers.md)).'''
witness = [
  { fixture = "integer_semantics", proven = "assert(s <= 255)" },
  { fixture = "integer_semantics", refuted = "assert(c > a)" },
]

[[capability]]
id = "unchecked"
area = "types"
feature = "`unchecked` arithmetic"
status = "verified"
notes = '''Wraps around as in the EVM: `+`, `-`, `*`, signed `/`, a power of
constants, `++`, `--`, unary `-` and `op=`.'''
works = "Integer conversions, wrapping and signed division as the EVM performs them"
witness = [
  { fixture = "unchecked_wrapping", proven = "assert(c == -128)" },
  { fixture = "unchecked_wrapping", refuted = "assert(c == 256)" },
]

[[capability]]
id = "conversions"
area = "types"
feature = "Type conversions"
status = "verified"
notes = '''Narrowing truncates (two's complement), a `bytesN` conversion keeps the
high bytes, widening keeps the value.'''
witness = [
  { fixture = "integer_semantics", proven = "assert(int8(uint8(200)) == -56)" },
  { fixture = "integer_semantics", refuted = "assert(s == v)" },
]

[[capability]]
id = "division"
area = "types"
feature = "`/` and `%`"
status = "verified"
notes = '''Signed `/` and `%` round toward zero. A zero divisor is an obligation
(`divisor is non-zero`).'''
witness = [
  { fixture = "integer_semantics", proven = "assert(a / b == -3)" },
  { fixture = "axiom_isolation", refuted = "divisor is non-zero" },
]

[[capability]]
id = "constants"
area = "types"
feature = "Constant expressions, named constants, `1e18`, `2.5 ether`, `2 days`"
status = "verified"
notes = '''The value solc computes, exactly (rational intermediate values, units,
exponents); a power of constants is folded.'''
witness = [
  { fixture = "constant_expressions", proven = "assert(2.5 ether == 2500000000000000000 && 1e18 == 10 ** 18)" },
  { fixture = "constant_expressions", refuted = "assert(1.5 gwei == 1500000001)" },
]

[[capability]]
id = "power-variable"
area = "types"
feature = "`**` with an operand that is not a constant"
status = "rejected"
notes = '''`x ** 2` can be written `x * x`.'''
witness = [
  { fixture = "gap_power_variable", error = "`**` with an operand that is not a constant" },
]

[[capability]]
id = "bitwise"
area = "types"
feature = "Bitwise operators and shifts"
status = "partial"
notes = '''`~` and shifts by a constant are exact; `&`, &#124;, `^` and shifts by a
variable are unknown values of the result's type (an unsigned `x & (2^n - 1)`
keeps it below `2^n`).'''
witness = [
  { fixture = "bitwise_types", proven = "assert(~x == -1)" },
  { fixture = "bitwise_types", refuted = "assert((a & b) >= 1)" },
