# ---------------------------------------------------------------- annotations
# The annotation keywords SpecParser.lean reads (checked).

[[annotation]]
keyword = "requires"
syntax = "requires <expr>"
placement = "Function"
meaning = "Precondition: assumed on entry, checked at each internal call"

[[annotation]]
keyword = "ensures"
syntax = "ensures <expr>"
placement = "Function"
meaning = "Postcondition: checked on exit; `old(e)` is the value of `e` on entry"

[[annotation]]
keyword = "invariant"
syntax = "invariant <expr>"
placement = "Contract or state variable"
meaning = '''Checked after the constructor and on exit of every public or external
function that may change state, assumed on their entry and by `view` functions'''

[[annotation]]
keyword = "modifies"
syntax = "modifies <vars>"
placement = "Function"
meaning = "Frame: only the listed state variables, or mapping keys, may change"

[[annotation]]
keyword = "loop-invariant"
syntax = "loop-invariant <expr>"
placement = "Function"
meaning = "Holds on entry to the function's loop and is preserved by its body"

# -------------------------------------------------------------------- options
# The options and environment variables StrataSolidityMain.lean reads (checked).

[[flag]]
name = "--json"
effect = "A flat JSON array of results (see [Output Formats](guide:output_formats.md))"

[[flag]]
name = "--sarif"
effect = "SARIF 2.1.0, for code scanning (see [SARIF](guide:sarif.md)); takes precedence over `--json`"

[[flag]]
name = "--pipeline-json"
effect = "One JSON object with the generated Laurel and Core programs, the obligations and their SMT files, and the warnings"

[[flag]]
name = "--strict"
effect = "Exit 1 when an obligation is refuted or unknown, or an annotation or function was not verified, in every output format"

[[flag]]
name = "--verbose"
effect = "Also print the generated Laurel and Core programs, to standard output (so the output of `--json` and `--sarif` is no longer valid JSON)"

[[flag]]
name = "--timeout=<s>"
effect = "Solver time limit per obligation, in seconds (default 10; `0` means none)"

[[flag]]
name = "--assume-no-reentrancy"
effect = "Trust that external calls do not call back into the contract, so they leave its state unchanged (see [Contract Invariants](guide:contract_invariants.md#external-calls-and-reentrancy))"

[[flag]]
name = "--no-array-theory"
effect = "Encode mappings with quantified select/update axioms instead of SMT arrays (the default); more results are then unknown"

[[flag]]
name = "--array-theory"
effect = "Accepted for compatibility; has no effect"

[[flag]]
name = "--dump-vc=<dir>"
effect = "Keep the generated `.smt2` files, in `<dir>/<procedure>/`"

[[flag]]
name = "--from-sol"
effect = "Read the input as Solidity whatever its name (a `.sol` file is read as Solidity anyway)"

[[flag]]
name = "--sol-source=<file>"
effect = "Take source positions and annotation text from `<file>`, for an input that is not the source file itself (the legacy `.solidity.st.ion` input)"

[[flag]]
name = "STRATA_SMT_DIR=<dir>"
effect = '''Environment variable: write the SMT files to `<dir>` (`--pipeline-json`
uses `/tmp/strata-pipeline-smt`). Each run first deletes every `.smt2` file
and every subdirectory in it: give it a directory of its own.'''

# ----------------------------------------------------------------------- gaps
# The gaps of the baseline (.kiro/specs/strata-solidity-baseline/requirements.md
# §12). `now` is their status on this branch; the entries citing a gap must
# agree with its status (checked).

[[gap]]
id = "GAP-001"
baseline = "No counterexample generation"
status = "narrowed"
now = '''A refuted obligation is reported failed, with a counterexample when z3
gives a model. Unknown results remain for quantified assumptions, nonlinear
arithmetic and timeouts.'''

[[gap]]
id = "GAP-002"
baseline = "Struct fields through mappings"
status = "open"
now = '''A function using a struct-valued mapping (or an array of structs) is not
verified, with a warning; a modifier using one stops the translation.'''

[[gap]]
id = "GAP-003"
baseline = "`old()` in loop invariants"
status = "closed"
now = '''`old(e)` in a loop invariant is the value at the function's entry.'''

[[gap]]
id = "GAP-004"
baseline = "`@custom:strata lemma` is not supported"
status = "open"
now = '''Reported as an unrecognized annotation, and ignored.'''

[[gap]]
id = "GAP-005"
baseline = "`block.timestamp` modeling"
status = "open"
now = '''One positive value per transaction; nothing relates transactions.'''

[[gap]]
id = "GAP-006"
baseline = "`msg.sender` in constructors"
status = "closed"
now = '''`msg.sender` in a constructor is the deployer, and is verified as in any
function.'''

[[gap]]
id = "GAP-007"
baseline = "External calls, reentrancy, cross-contract reasoning"
status = "narrowed"
now = '''A call that may re-enter makes the contract's state unknown except for its
invariants, which are checked before the call; `--assume-no-reentrancy`
trusts calls not to re-enter. Results of calls are unknown.'''

[[gap]]
id = "GAP-008"
baseline = "Dynamic array `push`/`pop`"
status = "narrowed"
now = '''`push` on an array state variable is modelled; `pop` stops the translation.'''

[[gap]]
id = "GAP-009"
baseline = "Full multi-contract inheritance with virtual dispatch"
status = "narrowed"
now = '''Closed by Requirement 1 above, except for bases in another file, arguments
in inheritance specifiers, `super` of an overloaded function and redeclared
private state variables.'''

[[gap]]
id = "GAP-010"
baseline = "Storage references to struct-through-mapping and to mappings"
status = "open"
now = '''A reference to a struct state variable can be read (writes through it are
rejected); one to a struct in a mapping is not verified, as GAP-002; one to a
mapping or an array is rejected.'''

[[gap]]
id = "GAP-011"
baseline = "XFAIL tests"
