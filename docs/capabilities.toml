# ------------------------------------------- external calls and assembly

[[capability]]
id = "external-calls"
area = "calls"
feature = "External calls and re-entrancy"
status = "unknown"
gap = "GAP-007"
notes = '''A call of another contract (through an interface, `this.f()`, an external
function value), a low-level `call`, or `new C(…)` may call back into the
contract: its state is unknown after the call, except for the contract
invariants, which an external function checks before the call and assumes
after it. `view` calls and `staticcall` change nothing, nor do `send` and
`transfer`; `delegatecall` may change all state, invariants included. Results
are unknown values of their type. A constructor cannot be re-entered.
`--assume-no-reentrancy` trusts that no call re-enters: calls other than
`delegatecall` then change nothing (see [Contract Invariants](guide:contract_invariants.md#external-calls-and-reentrancy)).'''
witness = [
  { fixture = "external_calls", proven = "invariant fee <= 100 holds before the external call" },
  { fixture = "external_calls", refuted = "ensures fee == old(fee)" },
  { fixture = "external_calls_trusted", proven = "ensures fee == old(fee)" },
]

